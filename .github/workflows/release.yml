name: release

# Builds the image, pushes it to the Scaleway registry and points the container at it. Runs on a version tag
# (`git tag v0.1.0 && git push origin v0.1.0`) or by hand from the Actions tab. infra/README.md has the setup.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional image tag (default: the git tag, or the short commit)"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_REGION: nl-ams
      SCW_CONTAINER_ID: ${{ secrets.SCW_CONTAINER_ID }}
      REGISTRY: rg.nl-ams.scw.cloud/bamdoodle
      IMAGE_NAME: bamdoodle
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the Scaleway registry
        uses: docker/login-action@v4
        with:
          registry: rg.nl-ams.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Work out the image tags
        id: tags
        run: |
          sha_short=$(git rev-parse --short HEAD)
          override='${{ inputs.tag }}'
          if [ -n "$override" ]; then
            primary="$override"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            primary="${{ github.ref_name }}"
          else
            primary="$sha_short"
          fi
          echo "sha=$sha_short" >> "$GITHUB_OUTPUT"
          echo "primary=$primary" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BAMDOODLE_VERSION=${{ steps.tags.outputs.primary }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.primary }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install the Scaleway CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Point the container at the new image (redeploys; running games end)
        run: |
          scw container container update "$SCW_CONTAINER_ID" \
            image="${REGISTRY}/${IMAGE_NAME}:${{ steps.tags.outputs.primary }}"

      - name: Wait until it's ready
        id: ready
        run: |
          for i in $(seq 1 30); do
            container=$(scw container container get "$SCW_CONTAINER_ID" -o json)
            status=$(echo "$container" | jq -r .status)
            echo "attempt $i: $status"
            case "$status" in
              ready)
                echo "host=$(echo "$container" | jq -r .domain_name)" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              error) echo "::error::the deploy failed; the previous version keeps running"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::not ready within 5 minutes"
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Smoke test, health and a short game over a real WebSocket
        run: |
          curl -fsS "https://${{ steps.ready.outputs.host }}/api/health"
          node scripts/ws-soak.mjs --url "wss://${{ steps.ready.outputs.host }}/ws" --rooms 1 --minutes 0
          deployed=$(curl -fsS "https://${{ steps.ready.outputs.host }}/api/version")
          echo "deployed version: $deployed"
          test "$deployed" = "${{ steps.tags.outputs.primary }}"
