<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BamDoodle – Draw, Guess &amp; Deceive – Party Game</title>
    <meta
      name="description"
      content="BamDoodle is a free multiplayer drawing and bluffing game for your phone. Draw the secret word together and catch the bamboozler who doesn&#39;t know it."
    />
    <link rel="canonical" href="https://bamdoodle.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BamDoodle" />
    <meta property="og:url" content="https://bamdoodle.io/" />
    <meta property="og:title" content="BamDoodle – Draw, Guess &amp; Deceive – Party Game" />
    <meta
      property="og:description"
      content="Draw the secret word together and catch the bamboozler who doesn&#39;t know it. Free, on your phone, no accounts."
    />
    <meta property="og:image" content="https://bamdoodle.io/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The BamDoodle logo, a rainbow hat on a trench coat, with Draw, Guess, Deceive"
    />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#080357" />
    <meta name="color-scheme" content="dark" />
    <!-- What the start page's "How to play" says, for search engines (HowToPlayUtils keeps the questions the same). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "VideoGame",
            "name": "BamDoodle",
            "url": "https://bamdoodle.io/",
            "description": "A free multiplayer drawing and bluffing party game for your phone. Draw the secret word together and catch the bamboozler who doesn't know it.",
            "genre": ["Party game", "Drawing game"],
            "gamePlatform": "Web browser",
            "applicationCategory": "Game",
            "operatingSystem": "Any",
            "numberOfPlayers": {
              "@type": "QuantitativeValue",
              "minValue": 3,
              "maxValue": 8
            },
            "inLanguage": ["en", "nl"],
            "isAccessibleForFree": true,
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "EUR"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How do you play BamDoodle?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Draw the secret word together: Everyone gets the same secret word and takes turns adding to one shared drawing, each on their own phone. One of you is bluffing: The bamboozler only sees the category and draws along. +1 if fewer than half of you catch them. Vote who’s sketchy: +1 for everyone who votes for the bamboozler. Caught or not, the bamboozler then guesses the word for +1."
                }
              },
              {
                "@type": "Question",
                "name": "Who wins?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Every round has a new secret word and a new bamboozler. Most points after the last round wins."
                }
              },
              {
                "@type": "Question",
                "name": "What do I need to play?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "In the browser on a phone, tablet or laptop, for 3 to 8 players. No app, no accounts, no ads."
                }
              }
            ]
          }
        ]
      }
    </script>
    <!-- Night from the first frame, before the stylesheet arrives: no white flash on reload. -->
    <style>
      html {
        background: #080357;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
