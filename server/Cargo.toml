[package]
name = "bamdoodle-server"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Game server for BamDoodle: rooms, rules and timers over WebSockets."

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ts-rs = "12.0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
